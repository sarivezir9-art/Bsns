<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doktor AI - Səsli Asistan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%); 
            color: #1e293b; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }

        .app-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }

        .avatar svg { width: 40px; height: 40px; fill: white; }

        h1 { font-size: 24px; font-weight: 700; margin: 0 0 5px 0; color: #0f172a; text-align: center; }
        p.subtitle { font-size: 14px; color: #64748b; margin: 0 0 30px 0; text-align: center; }

        #status { 
            font-size: 16px; 
            margin-bottom: 30px; 
            color: #0ea5e9; 
            text-align: center; 
            font-weight: 600; 
            min-height: 24px; 
            background: #f0f9ff;
            padding: 10px 20px;
            border-radius: 20px;
        }
        
        .key-container { margin-bottom: 25px; text-align: center; width: 100%; }
        input { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 12px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            background: #f8fafc; 
            color: #334155; 
            font-size: 14px; 
            text-align: center; 
            box-sizing: border-box; 
            transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: #10b981; }
        
        .save-btn { 
            background: #0f172a; 
            color: white; 
            border: none; 
            padding: 15px 20px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 600; 
            width: 100%; 
            transition: background 0.3s;
        }
        .save-btn:hover { background: #334155; }
        
        .mic-btn { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            background: #10b981; 
            border: none; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .mic-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(16, 185, 129, 0.4); }
        .mic-btn:active { transform: translateY(2px) scale(0.95); }
        
        .mic-btn.recording { 
            background: #ef4444; 
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.5); 
            animation: pulse 1.5s infinite; 
        }
        
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .mic-icon { width: 36px; height: 36px; fill: white; }
        
        #debugLog { 
            width: 100%; 
            margin-top: 30px; 
            padding: 15px; 
            background: #f8fafc; 
            border-radius: 12px; 
            border-left: 4px solid #cbd5e1; 
            font-family: monospace; 
            font-size: 12px; 
            color: #64748b; 
            word-break: break-all; 
            max-height: 100px; 
            overflow-y: auto; 
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="avatar">
            <svg viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>
        <h1>Doktor AI</h1>
        <p class="subtitle">Sizin şəxsi sağlamlıq asistanınız</p>

        <div class="key-container" id="keyBox">
            <input type="password" id="openAiKeyInput" placeholder="OpenAI API Açarı (sk-proj-...)">
            <button class="save-btn" onclick="saveKeys()">Sistemə Daxil Ol</button>
        </div>

        <div id="status" style="display:none;">Başlamaq üçün mikrofona toxunun</div>
        
        <button class="mic-btn" id="micBtn" style="display:none;">
            <svg class="mic-icon" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.42 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.3 6-6.72h-1.7z"/>
            </svg>
        </button>
        
        <div id="debugLog">Sistem: Asistan işə hazırdır.</div>
    </div>

    <script>
        const statusText = document.getElementById('status');
        const micBtn = document.getElementById('micBtn');
        const debugLog = document.getElementById('debugLog');
        const openAiKeyInput = document.getElementById('openAiKeyInput');
        const keyBox = document.getElementById('keyBox');

        if (localStorage.getItem('saved_openai_key')) {
            openAiKeyInput.value = localStorage.getItem('saved_openai_key');
            showApp();
        }

        function showApp() {
            keyBox.style.display = 'none';
            micBtn.style.display = 'flex';
            statusText.style.display = 'block';
        }

        function saveKeys() {
            if(openAiKeyInput.value.trim()) {
                localStorage.setItem('saved_openai_key', openAiKeyInput.value.trim());
                showApp();
                logStatus("Açar təsdiqləndi.", "success");
            } else {
                alert("Zəhmət olmasa, OpenAI açarını daxil edin.");
            }
        }

        function logStatus(msg, type = "info") {
            const colors = { info: { border: "#cbd5e1", text: "#64748b" }, success: { border: "#10b981", text: "#10b981" }, error: { border: "#ef4444", text: "#ef4444" } };
            debugLog.innerText = msg;
            debugLog.style.borderLeftColor = colors[type].border;
            debugLog.style.color = colors[type].text;
        }

        // Qısa və konkret cavablar üçün promt
        let chatHistory = [
            { role: "system", content: "Sən arıqlama mütəxəssisi Doktor AI-san. Səmimi və enerjili qadın tonunda danış. Azərbaycan dilində dolğun, lakin maksimum 2 qısa cümlə ilə çox sürətli cavablar ver. Fikrini qətiyyən uzatma." }
        ];

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false; // Sən susan kimi dərhal gözləmədən göndərəcək
recognition.interimResults = true; // Səs tanıma dəqiqliyini artıracaq
        }

        let isRecording = false;
        let finalTranscript = "";

        function resetMicButton() {
            isRecording = false;
            micBtn.classList.remove('recording');
        }

        micBtn.onclick = () => {
            if (!isRecording) {
                isRecording = true;
                finalTranscript = "";
                micBtn.classList.add('recording');
                statusText.innerText = "Sizi dinləyirəm...";
                logStatus("Mikrofon aktivdir...", "info");
                recognition.start();
            } else {
                statusText.innerText = "Emal olunur...";
                recognition.stop(); 
            }
        };

        if (recognition) {
            recognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript + " ";
                }
            };
            recognition.onend = () => {
                resetMicButton();
                if (finalTranscript.trim()) sendToOpenAI(finalTranscript.trim());
            };
        }

        async function sendToOpenAI(text) {
            statusText.innerText = "Düşünür...";
            chatHistory.push({ role: "user", content: text });
            if (chatHistory.length > 13) chatHistory.splice(1, chatHistory.length - 13); 

            const openAiKey = localStorage.getItem('saved_openai_key');

            try {
                // OpenAI Chat API (Sürətli gpt-4o-mini modeli)
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${openAiKey}` },
                    body: JSON.stringify({
                        model: "gpt-4o-mini", 
                        messages: chatHistory,
                        temperature: 0.7,
                        max_tokens: 100 // 
                    })
                });

                if (!response.ok) throw new Error("Mətn API xətası. Balansınızı və ya açarı yoxlayın.");
                const data = await response.json();
                const aiReply = data.choices[0].message.content;

                chatHistory.push({ role: "assistant", content: aiReply });
                speakText(aiReply, openAiKey); 

            } catch (error) {
                logStatus(error.message, "error");
                statusText.innerText = "Xəta baş verdi.";
            }
        }

        async function speakText(text, apiKey) {
            statusText.innerText = "Səsləndirilir...";

            try {
                // OpenAI Audio API
                const response = await fetch("https://api.openai.com/v1/audio/speech", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
    model: "tts-1",
    input: text,
    voice: "nova", 
    speed: 1.10
})
});

                if (!response.ok) throw new Error("Səs API xətası. OpenAI balansınız 0 ola bilər.");
                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                const audio = new Audio(audioUrl);
                
                audio.onplay = () => statusText.innerText = "Doktor AI danışır...";
                audio.onended = () => statusText.innerText = "Yeni sual üçün mikrofona toxunun.";
                audio.play().catch(e => console.log("Səs oynadıla bilmədi:", e));

            } catch (error) {
                logStatus(error.message, "error");
                statusText.innerText = "Səs oxunmadı.";
            }
        }
    </script>
</body>
</html>
